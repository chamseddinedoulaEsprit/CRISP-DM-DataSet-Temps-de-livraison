<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prédiction de Livraison - ML Models</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            padding: 2rem 0;
        }
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.95);
        }
        .card-header {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border-radius: 15px 15px 0 0 !important;
            padding: 1.5rem;
        }
        .form-control, .form-select {
            border-radius: 10px;
            border: 2px solid #e9ecef;
            padding: 0.75rem;
        }
        .form-control:focus, .form-select:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .btn-primary {
            background: linear-gradient(45deg, #667eea, #764ba2);
            border: none;
            border-radius: 10px;
            padding: 0.75rem 2rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .result-card {
            margin-top: 2rem;
            animation: slideIn 0.5s ease-in-out;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .loading {
            display: none;
        }
        .spinner-border {
            width: 2rem;
            height: 2rem;
        }
        .result-item {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 1rem;
            margin: 0.5rem 0;
            border-left: 4px solid #667eea;
        }
        .error-alert {
            background-color: #f8d7da;
            border-color: #f5c6cb;
            color: #721c24;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card">
                    <div class="card-header text-center">
                        <h2><i class="fas fa-shipping-fast me-2"></i>Prédiction de Livraison</h2>
                        <p class="mb-0">Utilisez nos modèles ML pour prédire le temps de livraison et analyser les commandes</p>
                    </div>
                    <div class="card-body">
                        <form id="predictionForm">
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="market_id" class="form-label">
                                            <i class="fas fa-store me-1"></i>ID Marché
                                        </label>
                                        <input type="number" class="form-control" id="market_id" name="market_id" value="1" min="1" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="store_id" class="form-label">
                                            <i class="fas fa-shop me-1"></i>ID Magasin
                                        </label>
                                        <input type="number" class="form-control" id="store_id" name="store_id" value="1" min="1" required>
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="store_primary_category" class="form-label">
                                            <i class="fas fa-tags me-1"></i>Catégorie du Magasin
                                        </label>
                                        <select class="form-select" id="store_primary_category" name="store_primary_category" required>
                                            {% for category in store_categories %}
                                            <option value="{{ category }}">{{ category }}</option>
                                            {% endfor %}
                                        </select>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="price_range" class="form-label">
                                            <i class="fas fa-euro-sign me-1"></i>Gamme de Prix
                                        </label>
                                        <select class="form-select" id="price_range" name="price_range" required>
                                            {% for range in price_ranges %}
                                            <option value="{{ range }}">{{ range }}</option>
                                            {% endfor %}
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-4">
                                    <div class="mb-3">
                                        <label for="total_items" class="form-label">
                                            <i class="fas fa-shopping-cart me-1"></i>Total Articles
                                        </label>
                                        <input type="number" class="form-control" id="total_items" name="total_items" value="1" min="1" required>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="mb-3">
                                        <label for="num_distinct_items" class="form-label">
                                            <i class="fas fa-list me-1"></i>Articles Distincts
                                        </label>
                                        <input type="number" class="form-control" id="num_distinct_items" name="num_distinct_items" value="1" min="1" required>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="mb-3">
                                        <label for="subtotal" class="form-label">
                                            <i class="fas fa-calculator me-1"></i>Sous-total (€)
                                        </label>
                                        <input type="number" class="form-control" id="subtotal" name="subtotal" value="10" min="0" step="0.01" required>
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="total_onshift_partners" class="form-label">
                                            <i class="fas fa-users me-1"></i>Livreurs Disponibles
                                        </label>
                                        <input type="number" class="form-control" id="total_onshift_partners" name="total_onshift_partners" value="5" min="1" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="delivery_duration_min" class="form-label">
                                            <i class="fas fa-clock me-1"></i>Durée Estimée (min)
                                        </label>
                                        <input type="number" class="form-control" id="delivery_duration_min" name="delivery_duration_min" value="30" min="1" required>
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-4">
                                    <div class="mb-3">
                                        <label for="day_of_week_numeric" class="form-label">
                                            <i class="fas fa-calendar me-1"></i>Jour de la Semaine
                                        </label>
                                        <select class="form-select" id="day_of_week_numeric" name="day_of_week_numeric" required>
                                            <option value="1">Lundi</option>
                                            <option value="2">Mardi</option>
                                            <option value="3">Mercredi</option>
                                            <option value="4">Jeudi</option>
                                            <option value="5">Vendredi</option>
                                            <option value="6">Samedi</option>
                                            <option value="7">Dimanche</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="mb-3">
                                        <label for="hour_of_day" class="form-label">
                                            <i class="fas fa-clock me-1"></i>Heure (0-23)
                                        </label>
                                        <input type="number" class="form-control" id="hour_of_day" name="hour_of_day" value="12" min="0" max="23" required>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="mb-3">
                                        <label for="temperature" class="form-label">
                                            <i class="fas fa-thermometer-half me-1"></i>Température (°C)
                                        </label>
                                        <input type="number" class="form-control" id="temperature" name="temperature" value="20" step="0.1" required>
                                    </div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="weather_condition" class="form-label">
                                    <i class="fas fa-cloud-sun me-1"></i>Condition Météo
                                </label>
                                <select class="form-select" id="weather_condition" name="weather_condition" required>
                                    {% for condition in weather_conditions %}
                                    <option value="{{ condition }}">{{ condition }}</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="text-center">
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-magic me-2"></i>Prédire
                                </button>
                                <div class="loading mt-3">
                                    <div class="spinner-border text-primary" role="status">
                                        <span class="visually-hidden">Chargement...</span>
                                    </div>
                                    <p class="mt-2">Analyse en cours...</p>
                                </div>
                            </div>
                        </form>

                        <div id="results" class="result-card" style="display: none;">
                            <div class="card">
                                <div class="card-header">
                                    <h5><i class="fas fa-chart-line me-2"></i>Résultats de la Prédiction</h5>
                                </div>
                                <div class="card-body" id="resultsContent">
                                    <!-- Les résultats seront affichés ici -->
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('predictionForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Afficher le spinner de chargement
            document.querySelector('.loading').style.display = 'block';
            document.querySelector('button[type="submit"]').disabled = true;
            document.getElementById('results').style.display = 'none';
            
            // Collecter les données du formulaire
            const formData = new FormData(this);
            const data = {};
            for (let [key, value] of formData.entries()) {
                data[key] = value;
            }
            
            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                // Masquer le spinner
                document.querySelector('.loading').style.display = 'none';
                document.querySelector('button[type="submit"]').disabled = false;
                
                // Afficher les résultats
                displayResults(result);
                
            } catch (error) {
                document.querySelector('.loading').style.display = 'none';
                document.querySelector('button[type="submit"]').disabled = false;
                
                displayError('Erreur de connexion: ' + error.message);
            }
        });
        
        function displayResults(result) {
            const resultsDiv = document.getElementById('results');
            const contentDiv = document.getElementById('resultsContent');
            
            if (result.success) {
                let html = '';
                const predictions = result.predictions;
                
                // Résultat LightGBM (temps de livraison)
                if (predictions.delivery_time_minutes !== undefined) {
                    html += `
                        <div class="result-item">
                            <h6><i class="fas fa-clock text-primary me-2"></i>Temps de Livraison Prédit</h6>
                            <p class="mb-1"><strong>${predictions.delivery_time_minutes} minutes</strong></p>
                            <p class="text-muted mb-0">${predictions.delivery_time_formatted}</p>
                        </div>
                    `;
                }
                
                if (predictions.delivery_time_error) {
                    html += `
                        <div class="result-item error-alert">
                            <h6><i class="fas fa-exclamation-triangle me-2"></i>Erreur LightGBM</h6>
                            <p class="mb-0">${predictions.delivery_time_error}</p>
                        </div>
                    `;
                }
                
                // Résultat DBSCAN (clustering)
                if (predictions.cluster !== undefined) {
                    html += `
                        <div class="result-item">
                            <h6><i class="fas fa-layer-group text-success me-2"></i>Analyse de Cluster</h6>
                            <p class="mb-1"><strong>Cluster ${predictions.cluster}</strong></p>
                            <p class="text-muted mb-0">${predictions.cluster_interpretation}</p>
                        </div>
                    `;
                }
                
                if (predictions.cluster_error) {
                    html += `
                        <div class="result-item error-alert">
                            <h6><i class="fas fa-exclamation-triangle me-2"></i>Erreur DBSCAN</h6>
                            <p class="mb-0">${predictions.cluster_error}</p>
                        </div>
                    `;
                }
                
                contentDiv.innerHTML = html;
            } else {
                displayError(result.error);
                return;
            }
            
            resultsDiv.style.display = 'block';
        }
        
        function displayError(errorMessage) {
            const resultsDiv = document.getElementById('results');
            const contentDiv = document.getElementById('resultsContent');
            
            contentDiv.innerHTML = `
                <div class="alert alert-danger" role="alert">
                    <i class="fas fa-exclamation-circle me-2"></i>
                    <strong>Erreur:</strong> ${errorMessage}
                </div>
            `;
            
            resultsDiv.style.display = 'block';
        }
    </script>
</body>
</html>
