version: '3.8'

services:
  delivery-prediction-app:
    build: .
    container_name: delivery-prediction
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - DEBUG=False
      - HOST=0.0.0.0
      - PORT=5000
    volumes:
      # Montage des modèles (à adapter selon votre configuration)
      - ./lightgbm_model.pkl:/app/lightgbm_model.pkl:ro
      - ./dbscan_model.pkl:/app/dbscan_model.pkl:ro
      # Montage optionnel pour les logs
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - delivery-network

  # Service optionnel : Nginx en reverse proxy
  nginx:
    image: nginx:alpine
    container_name: delivery-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - delivery-prediction-app
    restart: unless-stopped
    networks:
      - delivery-network

networks:
  delivery-network:
    driver: bridge

volumes:
  logs:
    driver: local